<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올팍 공연일 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
/* Layout: one phone-width column, sticky top bar, fixed bottom tab bar; desktop centers the column on a quiet ground */
:root{
  --ground:#e9eef0; --bg:#f7f9f9; --card:#ffffff; --fg:#14222b; --muted:#5d6d76; --line:#d9e1e4;
  --brand:#0f4c5c; --brand-ink:#ffffff; --accent:#e8a33a; --accent-soft:#fbefd9;
  --ok:#2f8a57; --ok-soft:#e1f2e8; --warn:#c98a0b; --warn-soft:#fdf1d6; --bad:#c43d32; --bad-soft:#fbe3e0;
  --bar-a:#0f4c5c; --bar-b:#b9c7cc; --locker:#6a4fc4; --wc:#1f6fb2; --park:#dfeadf; --water:#cfe3ec; --road:#ffffff;
  --display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0b1215; --bg:#111b20; --card:#18252b; --fg:#e6eef1; --muted:#97a8b0; --line:#2a3a41;
  --brand:#5fb3c6; --brand-ink:#0b1a1f; --accent:#f0b552; --accent-soft:#3a2f1b;
  --ok:#5cc28a; --ok-soft:#173226; --warn:#e7b245; --warn-soft:#382c12; --bad:#f07a6e; --bad-soft:#3d1f1c;
  --bar-a:#5fb3c6; --bar-b:#3d5059; --locker:#a993f0; --wc:#6fb0ea; --park:#1c2e24; --water:#1b3440; --road:#2a3a41; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0b1215; --bg:#111b20; --card:#18252b; --fg:#e6eef1; --muted:#97a8b0; --line:#2a3a41;
  --brand:#5fb3c6; --brand-ink:#0b1a1f; --accent:#f0b552; --accent-soft:#3a2f1b;
  --ok:#5cc28a; --ok-soft:#173226; --warn:#e7b245; --warn-soft:#382c12; --bad:#f07a6e; --bad-soft:#3d1f1c;
  --bar-a:#5fb3c6; --bar-b:#3d5059; --locker:#a993f0; --wc:#6fb0ea; --park:#1c2e24; --water:#1b3440; --road:#2a3a41; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (min-width:500px){.app{box-shadow:0 0 0 1px var(--line)}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--display);font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:inherit;font-size:20px;padding:0 4px;cursor:pointer;line-height:1}
.lang{display:flex;border:1px solid color-mix(in srgb,var(--brand-ink) 45%,transparent);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:inherit;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
.replay{background:var(--accent-soft);color:var(--fg);font-size:12px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px}
.replay b{font-variant-numeric:tabular-nums}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.src{font-size:11.5px;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px}
.tag.ex{background:var(--accent-soft);color:var(--fg)}
/* show cards */
.show{display:flex;gap:12px;align-items:stretch;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.show:hover,.show:focus-visible{border-color:var(--brand)}
.poster{width:72px;flex:none;word-break:keep-all;border-radius:10px;display:flex;align-items:flex-end;padding:8px;color:#fff;font:700 11px var(--display);line-height:1.2}
.show .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.show .t{font-weight:700;font-size:15px}
.show .v,.show .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 공연 검색, 목록 */
.finder{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,50px));z-index:4;background:var(--bg);
  margin:-6px -16px -6px;padding:10px 16px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sbox{position:relative}
.sbox input{width:100%;font:500 16px var(--body);color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 40px 10px 38px;-webkit-appearance:none;appearance:none}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox input:focus{outline:none;border-color:var(--brand)}
.sbox svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sbox .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.chip small{opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
.rescount{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.showlist{display:flex;flex-direction:column;gap:10px}
.dayhd{font:700 13px var(--display);color:var(--muted);margin:6px 0 -2px;font-variant-numeric:tabular-nums}
.dayhd .tag{margin-left:6px;vertical-align:1px}
.show .g{font-size:11.5px;color:var(--brand);font-weight:700}
.show mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:14px}
/* 인구 밀집도 */
.crowd .lv{display:flex;align-items:center;justify-content:space-between;gap:8px}
.crowd .lv b{font:700 22px/1.1 var(--display)}
.crowd .pp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.crowd .msg{font-size:13.5px;line-height:1.45}
.cstrip{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;align-items:end;height:40px}
.cstrip i{display:block;border-radius:3px 3px 1px 1px}
.clab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.pill.g-mid{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
/* 현장 제보 게시판 */
.cprev{display:flex;flex-direction:column;gap:6px;font-size:13px}
.cprev div{display:flex;gap:6px;align-items:center;min-width:0}
.cprev .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.cprev time{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.room{display:flex;justify-content:space-between;align-items:center;gap:10px}
.room .rt{font-weight:700;font-size:15px;line-height:1.35}
.room .rs{font-size:12.5px;color:var(--muted)}
.ctag{flex:none;display:inline-block;font:700 11px/1.5 var(--body);padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--fg))}
.ctag.c-line{--c:#2f6fd6}.ctag.c-goods{--c:#9a3fc2}.ctag.c-lost{--c:#c2571f}.ctag.c-transit{--c:#1f8a5b}.ctag.c-etc{--c:#6b7280}
.write{display:flex;flex-direction:column;gap:10px}
.write .lab{font-size:12.5px;color:var(--muted);font-weight:500}
.write textarea{width:100%;box-sizing:border-box;min-height:72px;resize:vertical;font:500 16px/1.45 var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.write textarea:focus{outline:none;border-color:var(--brand)}
.write .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.write .row small{font-size:12px;color:var(--muted)}
.write button[type=submit]{flex:none;border:0;border-radius:999px;background:var(--brand);color:var(--brand-ink);font:700 14px var(--body);padding:9px 18px;cursor:pointer}
.write button[type=submit]:disabled{opacity:.45;cursor:default}
.posts{display:flex;flex-direction:column;gap:8px}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.post.me{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.post p{margin:0;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.post .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.post .meta b{color:var(--fg);font-weight:600}
.post .meta .act{margin-left:auto}
.post .act{background:none;border:0;padding:0;font:500 12px var(--body);color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.post.hidden{background:none;border-style:dashed;flex-direction:row;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.bempty{text-align:center;color:var(--muted);font-size:14px;padding:18px 8px;border:1px dashed var(--line);border-radius:14px}
.expire{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
/* 제보 탭: 공연 제목 목록 */
.clist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.clist button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px;font:500 15px var(--body);color:var(--fg);cursor:pointer}
.clist button:first-child{border-top:0}
.clist button:hover,.clist button:focus-visible{background:color-mix(in srgb,var(--brand) 6%,transparent)}
.clist button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clist button em{font-style:normal;color:var(--muted);flex:none;font-size:13px}
/* notice */
.notice{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:14px;padding:12px 14px;display:flex;gap:10px}
.notice .ic{width:22px;height:22px;flex:none;border-radius:50%;background:var(--bad);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:13px}
.notice p{margin:0;font-size:14px}
.notice small{color:var(--muted);display:block;margin-top:2px}
/* timeline */
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:relative}
.tl div{text-align:center;font-size:12px;color:var(--muted)}
.tl b{display:block;font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.tl .dot{width:12px;height:12px;border-radius:50%;margin:0 auto 6px;background:var(--line);border:2px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.tl .now .dot{background:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tl::before{content:"";position:absolute;left:12.5%;right:12.5%;top:6px;height:2px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile:hover,.tile:focus-visible{border-color:var(--brand)}
.tile span{font-size:11.5px;color:var(--muted)}
.tile b{font-size:15px}
.tile em{font-style:normal;font-size:11.5px;color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.g-ok{background:var(--ok-soft);color:var(--ok)} .g-warn{background:var(--warn-soft);color:var(--warn)} .g-bad{background:var(--bad-soft);color:var(--bad)}
/* chart */
.chartwrap{overflow-x:auto}
svg text{font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lot{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lot:first-of-type{border-top:0}
.lot .n{font-weight:700}
.lot .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.lot .bar i{display:block;height:100%}
.lot .c{grid-column:1/-1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tip{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
/* safety */
.big{display:flex;align-items:center;gap:14px}
.big .temp{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.big .temp small{font-size:16px;font-weight:500;color:var(--muted)}
.hours{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.hours div{text-align:center;border-radius:8px;padding:6px 0;font-size:11px;font-variant-numeric:tabular-nums}
.hours b{display:block;font-size:13px}
.hours .cur{outline:2px solid var(--fg);outline-offset:-2px}
.rules{width:100%;border-collapse:collapse;font-size:13px}
.rules td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.rules td:first-child{width:72px}
ul.prep{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--brand)}
/* map */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:5px 12px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.mapbox{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card);position:relative;z-index:0}
#lmap{height:min(60vh,440px);width:100%;background:var(--water);font:13px var(--body)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.pin{position:relative;width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:var(--card);font:700 10.5px/1 var(--body);cursor:pointer}
.pin svg{width:15px;height:15px}
.pin.t-parking,.pin.t-locker{border-radius:7px}
.pin.t-locker{box-shadow:0 0 0 3px var(--r),0 1px 4px rgba(0,0,0,.35)}
.pin.mine{transform:scale(1.3);box-shadow:0 0 0 3px var(--accent),0 2px 6px rgba(0,0,0,.4);z-index:2}
.pin.hl::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2.5px solid var(--accent);animation:pinpulse 1.8s ease-out infinite}
.pin.sel{outline:2px dashed var(--fg);outline-offset:5px}
@keyframes pinpulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin.hl::after{animation:none}}
.pin .pl{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);white-space:nowrap;background:var(--card);color:var(--fg);padding:2px 7px;border-radius:6px;font:600 11.5px/1.4 var(--body);box-shadow:0 1px 3px rgba(0,0,0,.25);pointer-events:none}
.pin.mine .pl{transform:translateX(-50%) scale(.77);transform-origin:top center}
.pin.hl .pl{background:var(--accent);color:#1d1404}
.near{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.near button{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 12px;font:13px var(--body);cursor:pointer;min-width:0}
.near button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.near small{color:var(--muted);font-size:12px}
.near b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.near em{font-style:normal;font-size:12.5px;color:var(--brand);font-weight:700}
.dirs{display:inline-block;margin-top:8px;font-size:13.5px;font-weight:700;color:var(--brand)}
.leaflet-container a{color:var(--brand)}
.lmap-dark .leaflet-tile-pane{filter:brightness(.82) contrast(1.05)}
.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:focus-visible circle,.mk:focus-visible rect{stroke:var(--accent);stroke-width:3}
.info{display:flex;gap:12px;align-items:flex-start}
.info .sw{width:14px;height:14px;border-radius:4px;flex:none;margin-top:4px}
/* tab bar */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;pointer-events:none}
nav.tabs .in{pointer-events:auto;width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11px;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--brand);font-weight:700}
/* dashboard */
.hero{border-radius:16px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.35));pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero .ht{font:700 21px/1.3 var(--display);text-wrap:balance;margin:4px 0 2px}
.hero .hv{font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.hero .tag{background:rgba(255,255,255,.22);color:#fff}
.cd{background:rgba(0,0,0,.28);border-radius:12px;padding:10px 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cd b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.cd span{font-size:13px;opacity:.92}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:3px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);font-size:11.5px;opacity:.95;font-variant-numeric:tabular-nums}
.steps div:nth-child(2){text-align:center}.steps div:last-child{text-align:right}
.steps b{display:block;font-size:13px}
.tlnote{margin:-4px 0 0;font-size:11.5px;opacity:.88;line-height:1.4}
.steps .on{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.todo{border:2px solid var(--brand);border-radius:14px;padding:14px;background:var(--card)}
.todo .lab{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--brand);text-transform:uppercase}
.todo p{margin:4px 0 0;font-size:16px;font-weight:700;line-height:1.45;text-wrap:pretty}
.todo small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.chg{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.chg div{border-radius:10px;padding:8px 10px;font-size:13px;min-width:0}
.chg .was{background:var(--card);color:var(--muted);text-decoration:line-through}
.chg .now{background:var(--card);font-weight:700;border:1.5px solid var(--bad)}
.chg .arrow{color:var(--bad);font-weight:700}
.linkbtn{background:none;border:0;padding:0;margin-top:8px;color:var(--brand);font:700 13px var(--body);cursor:pointer}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.sc:hover,.sc:focus-visible{border-color:var(--brand)}
.sc.wide{grid-column:1/-1}
.sc .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.sc .hd em{font-style:normal;color:var(--brand);font-weight:700}
.sc .val{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.sc .val small{font-size:13px;font-weight:500;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;align-items:end;height:36px}
.strip i{display:block;border-radius:3px 3px 1px 1px}
.strip i.cur{outline:2px solid var(--fg);outline-offset:1px}
.striplab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{display:flex;flex-direction:column;gap:6px}
.mini div{display:grid;grid-template-columns:44px 1fr 32px;gap:6px;align-items:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.mini span.b{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mini span.b i{display:block;height:100%}
.route{display:flex;flex-direction:column;gap:6px;font-size:13px}
.route div{display:flex;gap:8px;align-items:center}
.route .n{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--card)}
/* 물품보관함 */
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sizes div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.sizes div b{font:700 18px/1.1 var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.sizes div b small{font-size:11px;font-weight:500;color:var(--muted)}
.sizes div.s-bad{background:var(--bad-soft);border-color:transparent}
.sizes div.s-warn{background:var(--warn-soft);border-color:transparent}
.lk{display:flex;flex-direction:column;gap:8px}
.lk .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lk .meta{font-size:12.5px;color:var(--muted)}
.lk.off{opacity:.6}
.wx{display:flex;flex-direction:column;gap:8px}
.wx .now{display:flex;align-items:center;gap:12px}
.wx .ic{font-size:38px;line-height:1}
.wx .tv{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums}
.wx .tv small{font-size:14px;font-weight:500;color:var(--muted)}
.wx .ds{font-size:13px;color:var(--muted);line-height:1.4}
.wx .ds b{color:var(--fg);font-size:14px}
.wx ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}
.wxh{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums}
.wxh div{border:1px solid var(--line);border-radius:8px;padding:5px 0}
.wxh div.rain{background:color-mix(in srgb,#3b82f6 14%,transparent);border-color:transparent}
.wxh span{display:block;font-size:17px;line-height:1.3}
.wxh b{display:block;font-size:13px}
.live{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:0 6px;margin-left:4px}
.lkline{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.lot .bar i{transition:width .4s ease}}

  const st = toMin(s.start), est = !s.end;

/* ===== 상태와 유틸 ===== */
const store = { get(k,d){ try{ return localStorage.getItem(k) ?? d }catch(e){ return d } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };
const state = { lang: store.get("lang","ko"), show: store.get("show","s1"), temp:null, filter:"all", place:null, q:"", venue:"all" };
const VIEWS = ["home","dash","chats","parking","map"];   // 아래 탭에 보이는 화면
const SUBVIEWS = ["locker","safety","chat"];      // 탭 없이 들어가는 화면. 아래 탭은 부모 탭에 불이 들어옴
const PARENT = { locker:"dash", safety:"dash", chat:"chats" };   // chat = 공연 하나의 제보 게시판, chats = 제보 탭(공연 제목 목록)
const t = () => T[state.lang];
const L = (o) => o[state.lang];
const show = () => SHOWS.find(s => s.id === state.show) || SHOWS[0];
const place = (id) => allPlaces().find(p => p.id === id);
function gradeOf(c){ if (c >= 33 || c <= -10) return "bad"; if (c >= 31 || c <= -5) return "warn"; return "ok"; }
function lotState(l){ const r = l.used / l.cap; return r >= .9 ? "bad" : r >= .7 ? "warn" : "ok"; }
const G = { ok:"g-ok", warn:"g-warn", bad:"g-bad" };
const GC = { ok:"var(--ok)", warn:"var(--warn)", bad:"var(--bad)" };
const pill = (g, label) => `<span class="pill ${G[g]}">${label}</span>`;
function currentView(){ const h = location.hash.slice(1); return VIEWS.includes(h) || SUBVIEWS.includes(h) ? h : "home"; }
// 보관함 상태: 빈 칸 0 = 만석, 15% 미만 = 얼마 안 남음, 그 외 = 여유
// 실제 API 는 전체 칸 수(total)를 주지 않아 null. 그때는 빈 칸 3개 이하를 '얼마 안 남음' 으로 봄
const hasTotal = (z) => z.total != null;
const lkSum = (k) => Object.values(k.sizes).reduce((a,z) => ({ total: a.total == null || !hasTotal(z) ? null : a.total + z.total, empty:a.empty+z.empty }), {total:0, empty:0});
function sizeState(z){ return z.empty === 0 ? "bad" : (hasTotal(z) ? z.empty / z.total < .15 : z.empty <= 3) ? "warn" : "ok"; }
function lockerState(k){ return k.op === false ? "off" : sizeState(lkSum(k)); }
// 마지막 갱신 문구: 실제 데이터면 "실시간 · " 없이 "마지막 갱신 11월 23일 10:20", 1시간 넘게 지났으면 경고
function lkStampMins(){ if (!LOCKERS_FETCHED) return null; const d = new Date(LOCKERS_FETCHED.replace(" ","T")+":00+09:00"); return isNaN(d) ? null : Math.round((Date.now()-d)/60000); }
function lkStamp(){
  if (LOCKERS_SAMPLE || !LOCKERS_FETCHED) return `${t().updated} ${LOCKERS_UPDATED}`;
  const [ymd, hm] = LOCKERS_FETCHED.split(" "), [, mo, da] = ymd.split("-").map(Number);
  return t().lastUpd(mo, da, hm);
}
const lkStale = () => { const m = lkStampMins(); return !LOCKERS_SAMPLE && m != null && m > 60; };
const lkPill = (st) => st === "off" ? `<span class="pill" style="background:var(--line);color:var(--muted)">${t().lkSt.off}</span>` : pill(st, t().lkSt[st]);
// 내 공연장 근처에서 빈 칸이 있는 보관함을 먼저, 없으면 아무 곳이나 빈 칸 많은 순
function lockersSorted(){
  const v = show().venue;
  return [...LOCKERS].sort((a,b) => (b.near.includes(v) - a.near.includes(v)) || (lkSum(b).empty - lkSum(a).empty));
}
function recLocker(){
  const v = show().venue;
  return lockersSorted().find(k => k.op !== false && k.near.includes(v) && lkSum(k).empty > 0) || null;
}
function sizesHTML(k){
  return `<div class="sizes">${["S","M","L"].map(z => { const d = k.sizes[z]; if (!d) return ""; const st = sizeState(d); return `
    <div class="s-${st}"><span>${t().size[z]}</span><b>${d.empty}${hasTotal(d) ? `<small> / ${d.total}</small>` : ""}</b><span>${t().sizeHint[z]}</span></div>`; }).join("")}</div>`;
}
// ===== 실시간 날씨 =====
const wxIcon = (sky, pty) => pty ? ([3,7].includes(pty) ? "🌨️" : [2,6].includes(pty) ? "🌨️" : "🌧️") : sky >= 4 ? "☁️" : sky === 3 ? "⛅" : "☀️";
const wxDesc = (sky, pty) => pty ? t().pty[pty] : t().sky[sky];
function wxStampMins(){ if (!WEATHER.fetched_at) return null; const d = new Date(WEATHER.fetched_at.replace(" ","T")+":00+09:00"); return isNaN(d) ? null : Math.round((Date.now()-d)/60000); }
// 관측은 매시 정시 자료가 40분쯤 나오므로, 2시간(120분)을 넘으면 오래된 값으로 봄
const wxStale = () => { const m = wxStampMins(); return !WEATHER.sample && m != null && m > 120; };
function wxStamp(){
  if (WEATHER.sample || !WEATHER.fetched_at) return t().wxSampleNote;
  const [ymd, hm] = WEATHER.fetched_at.split(" "), [, mo, da] = ymd.split("-").map(Number);
  return t().wxObs(mo, da, hm);
}
// 야외 공연 팁: 비, 눈 → 추위, 더위 → 바람 순서. 아무것도 없으면 '좋은 날씨'
function wxHints(){
  const n = WEATHER.now, hs = WEATHER.hours || [], out = [];
  const wet = hs.find(h => h.pty > 0);
  if (n.pty > 0) out.push(t().hint.rainNow);
  else if (wet) out.push(t().hint.rainAt(wet.time));
  if ([3,7].includes(n.pty) || hs.some(h => [3,7].includes(h.pty))) out.push(t().hint.snow);
  const fs = [n.feels, ...hs.map(h => h.feels)].filter(v => v != null);
  const lo = Math.min(...fs), hi = Math.max(...fs);
  if (lo <= -10) out.push(t().hint.freeze); else if (lo <= 0) out.push(t().hint.cold); else if (lo <= 8) out.push(t().hint.chilly);
  if (hi >= 31) out.push(t().hint.hot);
  if ((n.wind_ms || 0) >= 9) out.push(t().hint.windy);
  return out.length ? out : [t().hint.good];
}
// compact = 대시보드용 (누르면 대기 안전 화면), 아니면 대기 안전 화면 맨 위의 자세한 카드
function wxCard(compact){
  const n = WEATHER.now, g = gradeOf(n.feels ?? n.temp), hints = wxHints();
  const tag = WEATHER.sample ? `<span class="tag ex">${t().exData}</span>` : `<span class="live">${t().live}</span>`;
  const stamp = `<span style="font-size:12px${wxStale() ? ";color:var(--bad)" : ";color:var(--muted)"}">${wxStamp()}${wxStale() ? `, ${t().wxStale}` : ""}</span>`;
  const head = `
      <div class="now"><div class="ic" aria-hidden="true">${wxIcon(n.sky, n.pty)}</div>
        <div style="flex:1;min-width:0"><div class="tv">${n.temp.toFixed(1)}<small>°C  ${wxDesc(n.sky, n.pty)}</small></div>
          <div class="ds">${t().feels} <b>${(n.feels ?? n.temp).toFixed(1)}°</b>  |  ${t().humid} ${Math.round(n.humidity ?? 0)}%  |  ${t().wind} ${(n.wind_ms ?? 0).toFixed(1)}m/s${n.rain_1h_mm ? `  |  ${t().rain1h} ${n.rain_1h_mm}mm` : ""}</div></div>
        ${pill(g, t().grade[g])}</div>`;
  if (compact) return `
    <button class="sc wide wx" data-go="safety">
      <div class="hd"><span>${t().wxSafeT} ${tag}</span><em>${t().more} ›</em></div>${head}
      <div style="font-size:13.5px;font-weight:600">${t().gradeMsg[g]}</div>
      <div style="font-size:13px">${hints[0]}</div>${stamp}
    </button>`;
  const hs = WEATHER.hours || [];
  return `
  <div class="card wx" style="border-color:${GC[g]}">
    <h3 style="margin:0">${t().wxT} ${tag}</h3>${stamp}${head}
    ${hs.length ? `<div><div class="sub" style="margin:2px 0 6px;font-size:12.5px">${t().wxHours}</div>
      <div class="wxh">${hs.map(h => `<div class="${h.pty ? "rain" : ""}">${h.time.slice(0,2)}${state.lang==="ko"?"시":":00"}<span aria-hidden="true">${wxIcon(h.sky, h.pty)}</span><b>${Math.round(h.temp)}°</b>${h.rain_mm ? `${h.rain_mm < 1 ? "~1" : h.rain_mm}mm` : "&nbsp;"}</div>`).join("")}</div></div>` : ""}
    <div><div class="sub" style="margin:2px 0 4px;font-size:12.5px">${t().wxHintH}</div><ul>${hints.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <p class="sub" style="margin:0;font-size:12px">${t().wxSub}</p>
    <div class="src" style="margin-top:0">${WEATHER.sample ? t().srcWxSample : t().srcWx}</div>
  </div>`;
}
function go(v){ if (location.hash.slice(1) === v) render(); else location.hash = v; }

/* ===== 화면 1: 공연 선택 (검색 + 스크롤 목록) ===== */
// 검색: 띄어쓰기, 대소문자 무시. 공연명(한, 영), 공연장(한, 영), 장르, 날짜(2025-08-09, 08-09, 8/9, 8월 9일)로 찾음
// 여러 단어를 쓰면 모두 들어 있는 공연만 (예: "돔 8월")
const VENUE_ALIAS = { dome:"돔 체조경기장 kspo", hall:"올림픽홀 olympic hall", arena:"핸드볼 handball", lawn:"잔디 88 lawn 야외" };
const norm = (x) => String(x || "").toLowerCase().replace(/\s+/g, "");
function hay(s){
  const [y, m, d] = s.date.split("-"), mm = +m, dd = +d;
  return norm([s.title.ko, s.title.en, s.genre?.ko, s.genre?.en, place(s.venue)?.name.ko, place(s.venue)?.name.en, VENUE_ALIAS[s.venue],
    s.date, `${m}-${d}`, `${m}.${d}`, `${mm}/${dd}`, `${mm}월${dd}일`, `${mm}월`, `${y}년`].join("|"));
}
const terms = () => state.q.trim().split(/\s+/).map(norm).filter(Boolean);
function filteredShows(){
  const ts = terms();
  return SHOWS.filter(s => (state.venue === "all" || s.venue === state.venue) && ts.every(x => hay(s).includes(x)))
              .sort((a,b) => (a.date + a.start).localeCompare(b.date + b.start));
}
const esc = (x) => String(x).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
// 공연명에서 검색어와 같은 부분을 형광펜으로 표시
function hl(text){
  const ts = state.q.trim().split(/\s+/).filter(Boolean);
  if (!ts.length) return esc(text);
  const re = new RegExp("(" + ts.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return text.split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join("");
}
function dayLabel(date){
  const [y, m, d] = date.split("-").map(Number), w = new Date(Date.UTC(y, m-1, d)).getUTCDay();
  return t().dayFmt(y, m, d, t().wd[w]);
}
function showListHTML(){
  const list = filteredShows();
  if (!list.length) return `
    <div class="empty"><p style="margin:0 0 4px;color:var(--fg);font-weight:700">${t().noRes(esc(state.q.trim() || t().allVenues))}</p>
      <p style="margin:0 0 12px">${t().noResTip}</p><button class="chip" data-reset="1">${t().resetAll}</button></div>`;
  let last = "", out = "";
  list.forEach(s => {
    if (s.date !== last){ last = s.date; out += `<div class="dayhd">${dayLabel(s.date)}${s.date === DEMO.date ? `<span class="tag ex">${t().today}</span>` : ""}</div>`; }
    const vn = L(place(s.venue).name);

const fmtMan = (n) => n >= 10000 ? `${(Math.round(n/1000)/10).toString()}만` : n.toLocaleString("ko-KR");
const crowdIdx = (lv) => Math.max(0, CROWD_LEVELS.indexOf(lv));
const crowdPill = (lv) => { const i = crowdIdx(lv); const cls = ["g-ok","g-mid","g-warn","g-bad"][i]; return `<span class="pill ${cls}">${t().crowdLv[lv] || lv}</span>`; };
const crowdColor = (lv) => ["var(--ok)","var(--brand)","var(--warn)","var(--bad)"][crowdIdx(lv)];
function crowdMins(){ if (!CROWD.fetched_at) return null; const d = new Date(CROWD.fetched_at.replace(" ","T")+":00+09:00"); return isNaN(d) ? null : Math.round((Date.now()-d)/60000); }
const crowdStale = () => { const m = crowdMins(); return !CROWD.sample && m != null && m > 60; };
function crowdCard(){
  const c = CROWD, fc = (c.forecast || []).slice(0, 6);
  const tag = c.sample ? `<span class="tag ex">${t().exData}</span>` : `<span class="live">${t().live}</span>`;
  let stamp = t().srcCrowdSample;
  if (!c.sample && c.fetched_at){ const [ymd, hm] = c.fetched_at.split(" "), [, mo, da] = ymd.split("-").map(Number); stamp = `${t().srcCrowd}, ${t().crowdAt(mo, da, hm)}`; }
  const msg = state.lang === "ko" && c.message ? c.message : t().crowdMsg[c.level] || "";
  return `
    <div class="sc wide crowd" style="cursor:default">
      <div class="hd"><span>${t().crowdT} ${tag}</span></div>
      <div class="lv"><b style="color:${crowdColor(c.level)}">${t().crowdLv[c.level] || c.level}</b>${c.min ? `<span class="pp">${t().crowdPp(c.min, c.max || c.min)}</span>` : ""}</div>
      <div class="msg">${esc(msg)}</div>
      ${fc.length ? `<div><div class="sub" style="margin:0 0 4px;font-size:12px">${t().crowdNext}</div>
        <div class="cstrip">${fc.map(f => `<i title="${f.time} ${t().crowdLv[f.level] || f.level}" style="height:${25 + crowdIdx(f.level)*25}%;background:${crowdColor(f.level)}"></i>`).join("")}</div>
        <div class="clab">${fc.map(f => `<span>${f.time.slice(0,2)}${state.lang==="ko"?"시":""}</span>`).join("")}</div></div>` : ""}
      <span style="font-size:12px;color:${crowdStale() ? "var(--bad)" : "var(--muted)"}">${stamp}${crowdStale() ? `, ${t().crowdStale}` : ""}</span>

}

function dur(m){ const h = Math.floor(m/60), r = m % 60; return h ? (r ? `${h}${t().hr} ${r}${t().min}` : `${h}${t().hr}`) : `${r}${t().min}`; }
function viewDash(){

  const idx = { before:-1, arrive:0, show:1, after:2 }[phase];
  const pct = Math.max(0, Math.min(100, (nowM - marks[0]) / (marks[2] - marks[0]) * 100));
  const cd = phase === "before" || phase === "arrive" ? [t().toShow, dur(marks[1]-nowM)] : [phase === "show" ? t().inShow : t().afterShow, ""];
  let todo = t().todo[phase](s);
  const add = feel >= 33 ? t().heatAdd : feel <= -10 ? t().coldAdd : "";
  return `

    <p class="tlnote">${t().tlNote(tl.endEst)}</p>

/* ===== 화면 2: 주차장 혼잡 안내 ===== */
function chartSVG(){
  const W = 360, H = 200, pl = 34, pr = 8, pt = 10, pb = 26;
  // 세로축 최댓값: 데이터에 맞춰 자동 조정 (3칸 눈금이 딱 떨어지도록)
  const top = Math.max(...ENTRY_SHOW, ...ENTRY_NORM, 1), step = Math.ceil(top * 1.08 / 3 / 10) * 10, max = step * 3;
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw / HOURS.length;
  const y = v => pt + ih - (v / max) * ih;
  let g = "";
  [0, step, step*2, max].forEach(v => {
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${pl-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`;
  });
  const peakI = ENTRY_SHOW.indexOf(Math.max(...ENTRY_SHOW));
  HOURS.forEach((h, i) => {
    const x = pl + i * bw, w = (bw - 4) / 2;
    g += `<rect x="${x+2}" y="${y(ENTRY_NORM[i])}" width="${w}" height="${pt+ih-y(ENTRY_NORM[i])}" rx="2" fill="var(--bar-b)"/>`;
    g += `<rect x="${x+2+w}" y="${y(ENTRY_SHOW[i])}" width="${w}" height="${pt+ih-y(ENTRY_SHOW[i])}" rx="2" fill="${i===peakI?"var(--accent)":"var(--bar-a)"}"/>`;
    if (i % 2 === 0) g += `<text x="${x+bw/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${h}${state.lang==="ko"?"시":""}</text>`;
    if (h === DEMO.now) g += `<line x1="${x+bw/2}" x2="${x+bw/2}" y1="${pt}" y2="${pt+ih}" stroke="var(--fg)" stroke-dasharray="3 3" stroke-width="1"/>`;
  });
  const px = pl + peakI * bw + bw/2 + (bw-4)/4;
  g += `<text x="${px}" y="${y(ENTRY_SHOW[peakI])-4}" font-size="10" font-weight="700" text-anchor="middle" fill="var(--fg)">${ENTRY_SHOW[peakI]}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t().chartH}">${g}</svg>`;
}

    <p class="sub" style="margin:0 0 8px;font-size:12.5px${lkStale() ? ";color:var(--bad)" : ""}">${lkStamp()}${LOCKERS_SAMPLE ? "" : ` <span class="live">${t().live}</span>`}</p>
    ${lkStale() ? `<p class="sub" style="margin:0 0 6px;color:var(--bad)">${t().staleMsg}</p>` : ""}
    ${rec ? `<div class="lkline"><b>${L(rec.name)}</b>${LOCKERS_SAMPLE ? `<span class="tag ex">${t().exData}</span>` : ""}</div><div class="meta sub" style="margin:2px 0 8px">${L(rec.spot)}</div>${sizesHTML(rec)}` : `<p style="margin:0">${t().recNone}</p>`}
  </div>
  <h3 style="margin:4px 0 0">${t().lkAll}</h3>
  ${lockersSorted().map(card).join("")}
  <div class="tip">${t().lkTip}</div>
  <div class="src" style="margin-top:0">${LOCKERS_SAMPLE ? t().srcLocker : t().srcLockerLive}</div>`;
}

/* ===== 화면 4: 현장 지도 (Leaflet + OpenStreetMap, 키 없이 무료) =====
   모든 표시는 위도(lat), 경도(lon)로 찍음. 보관함은 data/lockers.json 의 lat, lon 을 그대로 씀.
   공연을 고르면 그 공연장을 가운데에 두고, 가장 가까운 "빈 칸 있는" 보관함과 화장실을 강조함 */
const lockerPlaces = () => LOCKERS.map(k => ({ id:k.id, type:"locker", lat:k.lat, lon:k.lon, name:k.name, desc:k.spot, locker:k }));
const allPlaces = () => [...PLACES, ...TOILETS, ...lockerPlaces()];
let MAP = null, MAP_LAYER = null;
// 두 지점 사이 직선거리(m)
function distM(a, b){ const r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLo = (b.lon-a.lon)*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2; return 2*6371000*Math.asin(Math.sqrt(h)); }
// 도보 시간: 직선거리에 1.3배(길이 굽는 만큼)를 곱하고 분당 67m 로 나눔
const walkMin = (m) => Math.max(1, Math.round(m * 1.3 / 67));
const fmtDist = (m) => m >= 1000 ? (m/1000).toFixed(1) + "km" : Math.round(m/10)*10 + "m";
function nearestOf(list, from){ let best = null; list.forEach(p => { const d = distM(from, p); if (!best || d < best.d) best = { p, d }; }); return best; }
function mapHighlights(){
  const v = place(show().venue);
  const free = lockerPlaces().filter(p => p.lat && lockerState(p.locker) !== "off" && lkSum(p.locker).empty > 0);
  return { v, lk: nearestOf(free, v), wc: nearestOf(TOILETS, v) };
}
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const GLYPH = {
  venue:'<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="6.5" cy="18" r="3" fill="currentColor"/><circle cx="17.5" cy="16" r="3" fill="currentColor"/></svg>',
  station:"M", parking:"P", toilet:"WC", lawn:"88",
  locker:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M9 9h6M9 14h6" stroke="currentColor" stroke-width="2.4"/></svg>'
};
function pinIcon(p, o){
  let bg = TYPE_COLOR[p.type], ring = "";
  if (p.type === "parking"){ const lot = LOTS.find(l => l.id === p.lot); if (lot) bg = GC[lotState(lot)]; }
  if (p.type === "locker"){ const st = lockerState(p.locker); ring = st === "off" ? "var(--muted)" : GC[st]; }
  const cls = ["pin", "t-" + p.type, o.mine ? "mine" : "", o.hl ? "hl" : "", o.sel ? "sel" : ""].join(" ");
  return window.L.divIcon({ className:"", iconSize:[28,28], iconAnchor:[14,14],
    html:`<div class="${cls}" style="--c:${bg};--r:${ring || bg}"><b>${GLYPH[p.type]}</b>${o.label ? `<span class="pl">${esc(o.label)}</span>` : ""}</div>` });
}
function mountMap(){
  const el = document.getElementById("lmap"); if (!el) return;
  if (!window.L || !window.L.map){ el.innerHTML = `<p class="sub" style="padding:16px">${t().mapFail}</p>`; return; }
  MAP = window.L.map(el, { zoomControl:true });
  const th = document.documentElement.dataset.theme, dark = th ? th === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  // 배경 지도: OpenStreetMap (키 없이 무료, 한국 지도가 자세함). 타일이 계속 안 오면 OSM 프랑스 서버(HOT 스타일)로 바꿈
  if (dark) el.classList.add("lmap-dark");
  const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
  const base = window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:OSM_ATTR }).addTo(MAP);
  let fails = 0;
  base.on("tileerror", () => { if (++fails === 4 && MAP){ MAP.removeLayer(base); window.L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", { subdomains:"abc", maxZoom:19, attribution:OSM_ATTR + ', tiles <a href="https://www.openstreetmap.fr" target="_blank" rel="noopener">OSM France</a>' }).addTo(MAP); } });
  MAP_LAYER = window.L.layerGroup().addTo(MAP);
  drawMarkers(true);
}
// fit=true 이면 화면 범위를 다시 맞춤 (처음 열 때, 종류 버튼을 바꿀 때)
function drawMarkers(fit){
  if (!MAP) return; const LF = window.L; MAP_LAYER.clearLayers();
  const { v, lk, wc } = mapHighlights(), f = state.filter;
  const vis = p => f === "all" || p.type === f;
  const hls = [lk && { ...lk, label:t().hlLk }, wc && { ...wc, label:t().hlWc }].filter(h => h && vis(h.p));
  const hlMap = new Map(hls.map(h => [h.p.id, h]));
  hls.forEach(h => LF.polyline([[v.lat, v.lon], [h.p.lat, h.p.lon]], { color:cssVar("--accent"), weight:3, dashArray:"2 7", lineCap:"round", opacity:.95, interactive:false }).addTo(MAP_LAYER));
  const shown = allPlaces().filter(p => p.lat && (vis(p) || p.id === v.id));
  shown.forEach(p => {
    const mine = p.id === v.id, h = hlMap.get(p.id), sel = state.place === p.id;
    const short = L(p.name).replace(/ \(.*\)/, "");
    const label = mine ? short + " ★" : h ? `${h.label} ${t().walkS(walkMin(h.d))}` : (sel || ["venue","station","lawn"].includes(p.type)) ? short : "";
    const m = LF.marker([p.lat, p.lon], { icon:pinIcon(p, { mine, hl:!!h, sel, label }), title:L(p.name), alt:L(p.name), keyboard:true,
      zIndexOffset: mine ? 1000 : h ? 900 : sel ? 800 : 0, riseOnHover:true });
    m.on("click", () => selectPlace(p.id));
    m.addTo(MAP_LAYER);
  });
  if (fit){
    const pts = state.place && place(state.place)?.lat && f === "all" ? [place(state.place), v] : f === "all" ? [v, ...hls.map(h => h.p)] : [v, ...shown];
    if (pts.length > 1) MAP.fitBounds(pts.map(p => [p.lat, p.lon]), { paddingTopLeft:[70,40], paddingBottomRight:[70,50], maxZoom:17 });
    else MAP.setView([v.lat, v.lon], 16);
  }
}
function selectPlace(id){
  state.place = state.place === id ? null : id;
  drawMarkers(false); updateMapInfo();
  const p = state.place && place(state.place); if (p && p.lat && MAP) MAP.panTo([p.lat, p.lon]);
}
function updateMapInfo(){
  const a = document.getElementById("mapinfo"), b = document.getElementById("mapnear");
  if (a) a.innerHTML = mapInfoHTML(); if (b) b.innerHTML = mapNearHTML();
}
function mapNearHTML(){
  const { lk, wc } = mapHighlights();
  const btn = (h, lab, empty) => h ? `<button data-place="${h.p.id}" aria-pressed="${state.place === h.p.id}"><small>${lab}</small><b>${esc(L(h.p.name))}</b><em>${t().walk(walkMin(h.d))}${h.p.type === "locker" ? `, ${t().emptyN(lkSum(h.p.locker).empty)}` : ""}</em></button>`
    : `<button disabled><small>${lab}</small><b>${empty}</b></button>`;
  return btn(lk, t().nearLk, t().noLk) + btn(wc, t().nearWc, "-");
}
function mapInfoHTML(){
  const v = place(show().venue), p = state.place ? place(state.place) : v;
  if (!p) return "";
  let extra = "";
  if (p.type === "parking") { const l = LOTS.find(x => x.id === p.lot), s = lotState(l); extra = ` ${pill(s, t().st[s])}`; }
  if (p.type === "locker") { extra = ` ${lkPill(lockerState(p.locker))} <span class="sub" style="font-size:12.5px;white-space:nowrap">${t().emptyN(lkSum(p.locker).empty)}</span>`; }
  if (p.id === v.id) extra += ` <span class="tag ex">${t().myVenue}</span>`;
  let dist = "";
  if (p.lat && p.id !== v.id){ const d = distM(v, p); dist = `<p class="sub" style="margin:4px 0 0;font-size:13px">${t().fromVenue(fmtDist(d), walkMin(d))}</p>`; }
  const nm = L(p.name), link = p.lat ? (state.lang === "ko"
    ? `https://map.kakao.com/link/to/${encodeURIComponent(nm)},${p.lat},${p.lon}`
    : `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking`) : "";
  return `<span class="sw" style="background:${TYPE_COLOR[p.type]}"></span>
    <div style="min-width:0"><b>${esc(nm)}</b>${extra}<p style="margin:4px 0 0;font-size:14px">${esc(L(p.desc))}</p>${dist}
    ${link ? `<a class="dirs" href="${link}" target="_blank" rel="noopener">${t().dirs}</a>` : ""}</div>`;
}
function viewMap(){
  return `
  <div><h2>${t().mapH}</h2><p class="sub">${t().mapSub}</p></div>
  <div class="near" id="mapnear">${mapNearHTML()}</div>
  <div class="chips">${Object.entries(t().filters).map(([k,v]) => `<button class="chip" data-filter="${k}" aria-pressed="${state.filter===k}">${k !== "all" ? `<i style="background:${TYPE_COLOR[k]}"></i>` : ""}${v}</button>`).join("")}</div>
  <div class="mapbox"><div id="lmap" role="region" aria-label="${t().mapH}"></div></div>
  <div class="card info" id="mapinfo">${mapInfoHTML()}</div>
  <p class="sub">${t().mapNote}</p>
  <div class="src" style="margin-top:0">${t().srcMap}</div>`;
}

/* ===== 렌더 ===== */
const ICONS = [
  '<path d="M4 6h16v12H4z M8 6v12 M4 10h4 M4 14h4" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 7h6V4h-6z" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  '<rect x="5" y="4" width="14" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 3.5h6v3H9z" fill="currentColor"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  '<rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 17V8h3a2.5 2.5 0 0 1 0 5h-3" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  '<path d="M12 21s-6-6.2-6-11a6 6 0 0 1 12 0c0 4.8-6 11-6 11z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.2" fill="currentColor"/>'
];
function render(){
  const v = currentView();
  document.documentElement.lang = state.lang;
  document.getElementById("title").textContent = v === "home" ? t().app : v === "locker" ? t().lockerT : v === "safety" ? t().wxSafeT : v === "chats" ? t().chatT : L(show().title);
  document.getElementById("back").hidden = v === "home";
  document.getElementById("replay").innerHTML = `<span>${t().replay}</span><span>${t().demoTime} <b>${DEMO.date} ${DEMO.now}:00</b></span>`;
  ["ko","en"].forEach(l => document.getElementById("lang-"+l).setAttribute("aria-pressed", state.lang === l));
  document.getElementById("tabs").innerHTML = VIEWS.map((x,i) =>
    `<a href="#${x}" ${x===v||PARENT[v]===x?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[i]}</svg>${t().tabs[i]}</a>`).join("");
  if (MAP){ try { MAP.remove(); } catch(e){} MAP = null; }
  document.getElementById("view").innerHTML = { home:viewHome, dash:viewDash, parking:viewParking, chat:viewChat, chats:viewChats, safety:viewSafety, map:viewMap, locker:viewLocker }[v]();
  document.documentElement.style.setProperty("--toph", document.querySelector(".top").offsetHeight + "px");
  if (v === "home") updateList();
  if (v === "map") mountMap();
  const r = document.getElementById("temp-range");
  if (r) r.oninput = e => { state.temp = parseFloat(e.target.value); const y = scrollY; render(); scrollTo(0,y); document.getElementById("temp-range").focus(); };
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-goplace],[data-show],[data-go],[data-filter],[data-place],[data-l],[data-venue],[data-reset],[data-rep],[data-unrep],[data-del],[data-chat],[data-bcat],[data-wcat],#q-x,#back,#temp-reset");
  if (!el) return;
  if (el.dataset.goplace){ state.place = el.dataset.goplace; state.filter = "all"; go("map"); }
  else if (el.dataset.show){ state.show = el.dataset.show; state.place = null; store.set("show", state.show); go("dash"); }
  else if (el.dataset.go){ if (el.dataset.go === "chat") state.chatFrom = "dash"; go(el.dataset.go); }
  else if (el.dataset.chat){ state.boardCat = "all"; state.writeCat = null; state.show = el.dataset.chat; state.place = null; store.set("show", state.show); state.chatFrom = "chats"; go("chat"); }
  else if (el.dataset.bcat){ state.boardCat = el.dataset.bcat; updateChat(); }
  else if (el.dataset.wcat){ state.writeCat = state.writeCat === el.dataset.wcat ? null : el.dataset.wcat; document.querySelectorAll("[data-wcat]").forEach(b => b.setAttribute("aria-pressed", b.dataset.wcat === state.writeCat)); updateSend(); }
  else if (el.dataset.rep) toggleReport(el.dataset.rep, true);
  else if (el.dataset.unrep) toggleReport(el.dataset.unrep, false);
  else if (el.dataset.del) deleteMine(el.dataset.del);
  else if (el.dataset.venue){ state.venue = el.dataset.venue; document.querySelectorAll("[data-venue]").forEach(b => b.setAttribute("aria-pressed", b.dataset.venue === state.venue)); updateList(); }
  else if (el.dataset.reset){ state.q = ""; state.venue = "all"; render(); }
  else if (el.id === "q-x"){ state.q = ""; const q = document.getElementById("q"); q.value = ""; updateList(); q.focus(); }
  else if (el.dataset.filter){ state.filter = el.dataset.filter; if (MAP){ document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b.dataset.filter === state.filter)); drawMarkers(true); } else render(); }
  else if (el.dataset.place){ if (MAP) selectPlace(el.dataset.place); else { state.place = el.dataset.place; render(); } }
  else if (el.dataset.l){ state.lang = el.dataset.l; store.set("lang", state.lang); render(); }
  else if (el.id === "back"){ const v = currentView(); go(v === "dash" ? "home" : v === "chat" ? (state.chatFrom || "chats") : "dash"); }
  else if (el.id === "temp-reset"){ state.temp = null; render(); }
});
document.addEventListener("keydown", e => {
  const g = e.target.closest && e.target.closest(".mk");
  if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); state.place = g.dataset.place; render(); }
});
// 검색칸: 한 글자 칠 때마다 바로 목록을 거름. 엔터를 누르면 휴대폰 키보드를 닫음
document.addEventListener("input", e => { if (e.target.id === "q"){ state.q = e.target.value; updateList(); } });
document.addEventListener("keydown", e => { if (e.target.id === "q" && e.key === "Enter") e.target.blur(); });
addEventListener("resize", () => document.documentElement.style.setProperty("--toph", document.querySelector(".top").offsetHeight + "px"));
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
// 제보 쓰기: 말머리를 고르고 글자가 있을 때만 올리기 버튼 켜기
document.addEventListener("input", e => { if (e.target.id === "chat-in") updateSend(); });
document.addEventListener("submit", e => { if (e.target.id === "composer"){ e.preventDefault(); sendChat(); } });

/* ===== JSON 데이터 불러오기 =====
   data/parking_entry.json : Colab 전처리 결과 (주차 그래프)
   data/lockers.json       : 물품보관함 현황 (GitHub Actions 15분마다 실시간 API 로 갱신)
   data/weather.json       : 올림픽공원 실시간 날씨 (GitHub Actions 15분마다 기상청 API 로 갱신)
   data/crowd.json         : 올림픽공원 인구 밀집도 (GitHub Actions 15분마다 서울시 실시간 인구데이터로 갱신)
   data/shows.json         : 공연 목록 (data/01_공연정보 CSV 를 올리면 GitHub Actions 가 변환)
   파일이 없거나 PC에서 index.html 을 그냥 더블클릭해 연 경우(file://)에는 위 샘플 값 그대로 보임. */
const getJSON = (url) => fetch(url + "?t=" + Date.now(), { cache:"no-store" }).then(r => r.ok ? r.json() : Promise.reject());
// 보관함은 GitHub Actions 가 15분마다 새 파일을 올림. 화면을 열어 둔 사람도 5분마다 새 값을 받아 다시 그림
function loadLockers(){
  return getJSON("data/lockers.json").then(d => { if (Array.isArray(d.lockers) && d.lockers.length){ LOCKERS = d.lockers; if (d.updated) LOCKERS_UPDATED = d.updated; LOCKERS_FETCHED = String(d.fetched_at || "").replace(/^(\d{4})(\d{2})(\d{2}) /, "$1-$2-$3 "); LOCKERS_SAMPLE = d.sample !== false; } });
}
// 날씨: GitHub Actions 가 15분마다 docs/data/weather.json 을 갱신 (scripts/update_weather.py)
function loadWeather(){
  return getJSON("data/weather.json").then(d => { if (d.now && typeof d.now.temp === "number"){ WEATHER = { ...d, hours: Array.isArray(d.hours) ? d.hours : [], sample: d.sample !== false }; } });
}
setInterval(() => { loadWeather().then(() => { if (["dash","safety"].includes(currentView()) && !document.activeElement?.matches("#temp-range")){ const y = scrollY; render(); scrollTo(0, y); } }).catch(() => {}); }, 5 * 60 * 1000);
setInterval(() => { loadLockers().then(() => { if (MAP){ drawMarkers(false); updateMapInfo(); } else if (["dash","locker"].includes(currentView())){ const y = scrollY; render(); scrollTo(0, y); } }).catch(() => {}); }, 5 * 60 * 1000);
// 인구 밀집도: GitHub Actions 가 15분마다 docs/data/crowd.json 을 갱신 (scripts/update_crowd.py)
function loadCrowd(){
  return getJSON("data/crowd.json").then(d => { if (d && CROWD_LEVELS.includes(d.level)){ CROWD = { ...d, forecast: Array.isArray(d.forecast) ? d.forecast : [], sample: d.sample !== false }; } });
}
setInterval(() => { loadCrowd().then(() => { if (currentView() === "dash"){ const y = scrollY; render(); scrollTo(0, y); } }).catch(() => {}); }, 5 * 60 * 1000);
// 공연 목록: 공연장 표준 id(dome, hall, arena, lawn)와 날짜, 시작 시각이 있는 줄만 씀
const VENUE_IDS = ["dome","hall","arena","lawn"];
function loadShows(){
  return getJSON("data/shows.json").then(d => {
    const ok = (d.shows || []).filter(s => s && s.id && VENUE_IDS.includes(s.venue) && s.title && s.date && /^\d{1,2}:\d{2}$/.test(s.start));
    if (ok.length){ SHOWS = ok.map(s => ({ ...s, end: /^\d{1,2}:\d{2}$/.test(s.end || "") ? s.end : "", title: typeof s.title === "string" ? {ko:s.title, en:s.title} : s.title })); SHOWS_SAMPLE = d.sample !== false; fillPosters(); }
  });
}
Promise.allSettled([
  loadShows(),
  loadCrowd(),
  getJSON("data/parking_entry.json").then(d => { if (d.hours && d.entry_show && d.entry_norm){ HOURS = d.hours; ENTRY_SHOW = d.entry_show; ENTRY_NORM = d.entry_norm; } }),
  loadLockers(),
  loadWeather()
]).finally(render);
</script>
