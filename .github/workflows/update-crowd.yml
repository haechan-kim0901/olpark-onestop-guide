# 올림픽공원 인구 밀집도 자동 갱신
# 15분마다 scripts/update_crowd.py 를 실행해 docs/data/crowd.json 을 새로 만들고,
# 팀 확인용 CSV(data/08_인구밀집도/ 폴더: 전처리 전 raw/, 전처리 후 processed/crowd_*.csv)도 함께 저장하고,
# 바뀐 내용이 있으면 main 에 커밋합니다. 그러면 GitHub Pages 데모에 1~2분 뒤 반영됩니다.
# 인증키는 저장소 Settings > Secrets and variables > Actions 의 SEOUL_API_KEY (서울 열린데이터광장 키) 에서 읽습니다.
# 키가 아직 없으면 아무것도 바꾸지 않고 끝납니다 (화면은 샘플 값).
# Actions 탭에서 "Run workflow" 버튼으로 바로 실행할 수도 있습니다.
name: 인구 밀집도 자동 갱신

on:
  schedule:
    - cron: "12,27,42,57 * * * *"   # 15분마다, 보관함, 날씨 갱신과 겹치지 않게 어긋나게
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-crowd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 인구 밀집도 받기
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python scripts/update_crowd.py

      - name: 바뀌었으면 커밋
        run: |
          git add docs/data/crowd.json "data/08_인구밀집도"
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "인구 밀집도 자동 갱신"
          git pull --rebase origin main
          git push
