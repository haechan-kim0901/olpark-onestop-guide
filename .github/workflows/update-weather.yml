# 올림픽공원 실시간 날씨 자동 갱신
# 15분마다 scripts/update_weather.py 를 실행해 docs/data/weather.json 을 새로 만들고,
# 바뀐 내용이 있으면 main 에 커밋합니다. 그러면 GitHub Pages 데모에 1~2분 뒤 반영됩니다.
# 기상청 자료는 한 시간에 한 번 바뀌므로, 커밋도 보통 한 시간에 한 번 생깁니다.
# 인증키는 물품보관함과 같은 Secret(DATA_GO_KR_KEY)을 씁니다.
# Actions 탭에서 "Run workflow" 버튼으로 바로 실행할 수도 있습니다.
name: 날씨 자동 갱신

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15분마다, 보관함 갱신과 겹치지 않게 7분 어긋나게
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 날씨 데이터 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/update_weather.py

      - name: 바뀌었으면 커밋
        run: |
          git add docs/data/weather.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "날씨 자동 갱신"
          git pull --rebase origin main
          git push
